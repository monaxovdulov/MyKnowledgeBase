services:
  caddy:
    image: caddy:2-alpine
    container_name: granit-staging-caddy-1
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - /srv/botops/Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/botops/staging-overrides:/srv/overrides:ro
      # статика codex-vibe-data (artifacts/live) для file_server-маршрутов
      # на не-botops доменах; caddy_data сам сидит на /data — не конфликтовать
      - /home/devuser/codex-vibe-data:/srv/data:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - granit-staging

networks:
  granit-staging:
    external: true
    name: granit-staging_default

volumes:
  caddy_data:
  caddy_config:
